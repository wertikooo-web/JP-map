  <style>.multi-interest{position:relative;margin-top:7px}.multi-interest-trigger{width:100%;min-height:40px;background:#fff;border:1px solid #b8b1a5;padding:9px 11px;display:flex;justify-content:space-between;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer}.multi-interest-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.multi-interest-menu{display:none;position:absolute;z-index:10000;left:0;right:0;top:calc(100% - 1px);background:#fff;border:1px solid #8f887c;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px 0}.multi-interest.open .multi-interest-menu{display:block}.mi-option{display:flex!important;align-items:center;gap:9px;padding:7px 11px;margin:0!important;cursor:pointer;text-transform:none!important;letter-spacing:0!important;font-size:14px!important}.mi-option:hover{background:#f2efe8}.mi-option input{width:16px;height:16px;margin:0;accent-color:#1f5749}.mi-all{border-bottom:1px solid #ddd8cf;margin-bottom:4px!important;padding-bottom:9px}</style>
