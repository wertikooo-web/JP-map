<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>KANDO Japan Map</title><meta name="description" content="KANDO interactive Japan travel map and itinerary builder"/><link rel="preconnect" href="https://a.basemaps.cartocdn.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/></head><body><div id="root"></div><script>const swapMapTiles=()=>{document.querySelectorAll('img.leaflet-tile').forEach(img=>{if(img.src.includes('tile.openstreetmap.org')){try{const u=new URL(img.src);const p=u.pathname;img.src='https://a.basemaps.cartocdn.com/light_all'+p}}catch(e){}}});const a=document.querySelector('.leaflet-control-attribution');if(a&&!a.dataset.carto){a.insertAdjacentHTML('beforeend',' | &copy; <a href="https://carto.com/attributions">CARTO</a>');a.dataset.carto='1'}};new MutationObserver(swapMapTiles).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});</script><script type="module" src="/src/main.tsx"></script></body></html>
