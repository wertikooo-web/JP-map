<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>KANDO Japan Map</title><meta name="description" content="KANDO interactive Japan travel map and itinerary builder"/><link rel="preconnect" href="https://server.arcgisonline.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/></head><body><div id="root"></div><script>const swapMapTiles=()=>{document.querySelectorAll('img.leaflet-tile').forEach(img=>{if(!img.dataset.englishMap){try{const u=new URL(img.src);const parts=u.pathname.split('/').filter(Boolean);let z,x,y;if(u.hostname.includes('openstreetmap.org')){[z,x,y]=parts.slice(-3);y=y.replace('.png','')}else if(u.hostname.includes('cartocdn.com')){[z,x,y]=parts.slice(-3);y=y.replace('.png','')}if(z&&x&&y){img.dataset.englishMap='1';img.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`}}catch(e){}}});const a=document.querySelector('.leaflet-control-attribution');if(a&&!a.dataset.esri){a.innerHTML='Tiles &copy; Esri | Data &copy; OpenStreetMap contributors';a.dataset.esri='1'}};new MutationObserver(swapMapTiles).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});swapMapTiles();</script><script type="module" src="/src/main.tsx"></script></body></html>
